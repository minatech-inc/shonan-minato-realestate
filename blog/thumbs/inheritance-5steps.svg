<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg-inh1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451a03"/>
      <stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="doc-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="step-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow-inh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg-inh1)"/>

  <!-- Grid background -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>

  <!-- 5-step horizontal timeline -->
  <g transform="translate(95, 410)">
    <!-- Connecting line -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#f59e0b" stroke-width="3" opacity="0.4"/>
    <line x1="0" y1="0" x2="600" y2="0" stroke="#fff" stroke-width="1" opacity="0.3" stroke-dasharray="6,6"/>

    <!-- Step 1 -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="0" r="22" fill="url(#step-grad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#fff" font-size="20" font-weight="700">1</text>
      <text x="0" y="48" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="11" opacity="0.85">相続人確定</text>
    </g>
    <!-- Step 2 -->
    <g transform="translate(150, 0)">
      <circle cx="0" cy="0" r="22" fill="url(#step-grad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#fff" font-size="20" font-weight="700">2</text>
      <text x="0" y="48" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="11" opacity="0.85">現況確認</text>
    </g>
    <!-- Step 3 -->
    <g transform="translate(300, 0)">
      <circle cx="0" cy="0" r="22" fill="url(#step-grad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#fff" font-size="20" font-weight="700">3</text>
      <text x="0" y="48" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="11" opacity="0.85">遺産分割</text>
    </g>
    <!-- Step 4 -->
    <g transform="translate(450, 0)">
      <circle cx="0" cy="0" r="22" fill="url(#step-grad)"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#fff" font-size="20" font-weight="700">4</text>
      <text x="0" y="48" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="11" opacity="0.85">相続登記</text>
    </g>
    <!-- Step 5 -->
    <g transform="translate(600, 0)">
      <circle cx="0" cy="0" r="26" fill="#fbbf24" stroke="#fff" stroke-width="2"/>
      <text x="0" y="6" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#7c2d12" font-size="22" font-weight="700">5</text>
      <text x="0" y="48" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="11" opacity="0.9">税申告</text>
    </g>
  </g>

  <!-- Center document with seal -->
  <g filter="url(#shadow-inh)" transform="translate(290, 175)">
    <!-- Document paper -->
    <rect x="0" y="0" width="220" height="160" rx="4" fill="url(#doc-grad)"/>
    <!-- Top accent stripe -->
    <rect x="0" y="0" width="220" height="20" rx="4" fill="#7c2d12"/>
    <rect x="0" y="14" width="220" height="6" fill="#7c2d12"/>
    <!-- Document lines -->
    <g stroke="#a78bfa" stroke-width="1.5" opacity="0">
    </g>
    <g stroke="#92400e" stroke-width="1.5" opacity="0.4">
      <line x1="18" y1="42" x2="160" y2="42"/>
      <line x1="18" y1="62" x2="170" y2="62"/>
      <line x1="18" y1="82" x2="155" y2="82"/>
      <line x1="18" y1="102" x2="175" y2="102"/>
      <line x1="18" y1="122" x2="140" y2="122"/>
    </g>
    <!-- Title text on doc -->
    <text x="110" y="35" text-anchor="middle" font-family="'Noto Serif JP', serif" fill="#fff" font-size="11" font-weight="600" letter-spacing="0.1em">遺産分割協議書</text>
    <!-- Hanko seal (red circle) -->
    <g transform="translate(185, 130)">
      <circle r="22" fill="none" stroke="#dc2626" stroke-width="2.5"/>
      <circle r="18" fill="none" stroke="#dc2626" stroke-width="1"/>
      <text y="5" text-anchor="middle" font-family="'Noto Serif JP', serif" fill="#dc2626" font-size="11" font-weight="700">磯谷</text>
    </g>
  </g>

  <!-- Calendar icon top right -->
  <g filter="url(#shadow-inh)" transform="translate(595, 110)">
    <rect x="0" y="0" width="100" height="90" rx="6" fill="#fff"/>
    <rect x="0" y="0" width="100" height="24" rx="6" fill="#dc2626"/>
    <rect x="0" y="18" width="100" height="6" fill="#dc2626"/>
    <text x="50" y="58" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#7c2d12" font-size="34" font-weight="700">10</text>
    <text x="50" y="78" text-anchor="middle" font-family="'Noto Sans JP', sans-serif" fill="#7c2d12" font-size="10" font-weight="600">ヶ月期限</text>
    <!-- Calendar rings -->
    <rect x="20" y="-6" width="6" height="14" rx="2" fill="#fff"/>
    <rect x="74" y="-6" width="6" height="14" rx="2" fill="#fff"/>
  </g>

  <!-- Title -->
  <g font-family="'Noto Sans JP', sans-serif" fill="#fff">
    <text x="60" y="80" font-size="13" letter-spacing="0.18em" opacity="0.75" font-weight="500">INHERITANCE · 5 STEPS</text>
    <text x="60" y="118" font-size="26" font-weight="700">相続不動産の実務手順</text>
  </g>
</svg>
