<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&family=Cormorant+Garamond:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 2500px; height: 1686px; overflow: hidden; }
  body {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    background: #0a2540;
    font-family: 'Noto Serif JP', serif;
  }
  .cell {
    background: #14375a;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    border-top: 6px solid #c9a96e;
  }
  .cell::after {
    content: '';
    position: absolute;
    bottom: 80px;
    width: 120px;
    height: 4px;
    background: #c9a96e;
  }
  .brand-mark {
    position: absolute;
    top: 35px;
    right: 35px;
    width: 180px;
    height: 180px;
    opacity: 0.95;
  }
  .brand-mark path {
    stroke: #dbc291;
    fill: none;
    stroke-width: 5;
    stroke-linecap: square;
    stroke-miterlimit: 10;
  }
  .icon {
    width: 260px;
    height: 260px;
    margin-bottom: 60px;
    stroke: #dbc291;
    fill: none;
    stroke-width: 8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .jp {
    font-size: 92px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 2px;
    margin-bottom: 24px;
  }
  .en {
    font-family: 'Cormorant Garamond', serif;
    font-size: 42px;
    color: #c9a96e;
    letter-spacing: 8px;
    text-transform: uppercase;
  }
  .brand-band {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: #0a2540;
    padding: 18px 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    z-index: 10;
    border-bottom: 2px solid #c9a96e;
  }
  .brand-band svg { height: 60px; }
  .brand-band .wordmark {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    color: #f6f3ec;
    letter-spacing: 6px;
  }
</style>
</head>
