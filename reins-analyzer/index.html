<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>移転のお知らせ | MinaTech Realty Console</title>
    <meta http-equiv="refresh" content="3; url=https://realty.minatech1210.com/">
    <link rel="canonical" href="https://realty.minatech1210.com/">
    <meta name="robots" content="noindex">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter','Noto Sans JP','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
            background: linear-gradient(135deg,#f7f8fb 0%,#eef1f6 100%);
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            line-height: 1.6;
        }
        .card {
            max-width: 560px;
            background: #ffffff;
            border: 1px solid #e3e8ef;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(15,23,42,0.08);
            padding: 40px 36px;
            text-align: center;
        }
        .brand-mark {
            width: 56px; height: 56px;
            background: linear-gradient(135deg,#3b82f6 0%,#8b5cf6 100%);
            border-radius: 14px;
            color: #fff;
            font-weight: 800;
            font-size: 28px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(59,130,246,0.35);
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 8px;
        }
        h2 {
            font-size: 14px;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 24px;
        }
        .url-box {
            background: #f7f8fb;
            border: 1px solid #e3e8ef;
            border-radius: 10px;
            padding: 14px 18px;
            margin: 18px 0 22px;
            font-family: 'JetBrains Mono','SF Mono',Consolas,monospace;
            font-size: 14px;
            word-break: break-all;
        }
        .url-box a { color: #3b82f6; text-decoration: none; font-weight: 600; }
        .url-box a:hover { text-decoration: underline; }
        .info {
            background: #eff6ff;
            border-left: 3px solid #3b82f6;
            border-radius: 6px;
            padding: 12px 16px;
            text-align: left;
            font-size: 13px;
            color: #1e40af;
            margin-bottom: 18px;
        }
        .info strong { color: #1e3a8a; }
        .countdown {
            font-size: 12px;
            color: #6b7280;
            margin-top: 14px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg,#3b82f6,#8b5cf6);
            color: #fff !important;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.15s ease;
            box-shadow: 0 4px 16px rgba(59,130,246,0.3);
        }
        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59,130,246,0.4);
        }
        .footer {
            margin-top: 28px;
            font-size: 11px;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="card" role="alert" aria-live="polite">
        <div class="brand-mark">M</div>
        <h1>新URLへ移行しました</h1>
        <h2>REINS Analyzer は MinaTech Realty Console としてリブランディング</h2>

        <div class="url-box">
            移転先：<a href="https://realty.minatech1210.com/">https://realty.minatech1210.com/</a>
        </div>

        <div class="info">
            <strong>📌 既存ライセンスはそのまま有効</strong><br>
            ライセンスキーの再入力は不要です。同じキーで新URLにアクセスください。
        </div>

        <a href="https://realty.minatech1210.com/" class="btn">新URLへ移動 →</a>

        <p class="countdown">
            <span id="countdown">3</span> 秒後に自動的に移動します
        </p>

        <p class="footer">
            MinaTech株式会社 / お問い合わせ：<a href="mailto:isoya.h@minatech1210.com" style="color:#6b7280;">isoya.h@minatech1210.com</a>
        </p>
    </div>

    <script>
        var sec = 3;
        var el = document.getElementById('countdown');
        var timer = setInterval(function() {
            sec--;
            if (sec <= 0) { clearInterval(timer); }
            else if (el) { el.textContent = sec; }
        }, 1000);
    </script>
</body>
</html>
