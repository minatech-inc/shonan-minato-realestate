<body>
    <header id="site-header" class="site-header"></header>

    <div class="page-header">
        <div class="container">
            <span class="section-label">Contact</span>
            <h1>お問い合わせ</h1>
        </div>
    </div>

    <section class="form-section">
        <div class="form-container">
            <div class="form-card">
                <p style="text-align: center; color: var(--gray-700); margin-bottom: 2rem; font-size: 0.9rem; line-height: 2;">
                    購入・売却・投資・テナント — あらゆるご相談にお応えします。<br>
                    下記フォーム・お電話（<a href="tel:0466-96-0313" style="color: var(--gold-dark);">0466-96-0313</a>）・LINE公式アカウントにて承ります。
                </p>
                <div style="display: flex; flex-direction: column; align-items: center; gap: 0.8rem; padding: 1.8rem; background: #06c755; border-radius: 8px; margin-bottom: 2.5rem;">
                    <div style="color: #fff; font-size: 0.95rem; font-weight: 500;">LINEでお気軽にご相談ください</div>
                    <a href="https://lin.ee/SnaIIqa" target="_blank" rel="noopener" style="display: inline-block; padding: 0.8rem 2rem; background: #fff; color: #06c755; border-radius: 4px; font-weight: 600; text-decoration: none; font-size: 0.9rem;">LINEで友だち追加</a>
                    <div style="color: rgba(255,255,255,0.9); font-size: 0.75rem;">ID: @760zrvim</div>
                </div>

                <form action="https://formspree.io/f/xnjlaqdr" method="POST" id="inquiry-form">
                    <input type="hidden" name="_subject" value="【サイト問い合わせ】Shonan Minato REAL ESTATE">
                    <div class="form-row">
                        <label>お名前 <span class="required">必須</span></label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-row">
                        <label>メールアドレス <span class="required">必須</span></label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-row">
                        <label>電話番号</label>
                        <input type="tel" name="tel">
                    </div>
                    <div class="form-row">
                        <label>お問い合わせ種別 <span class="required">必須</span></label>
                        <select name="category" required>
                            <option value="">選択してください</option>
                            <option value="residence">住宅購入について</option>
                            <option value="investment">投資物件について</option>
                            <option value="luxury">富裕層向け物件について</option>
                            <option value="commercial">法人・テナントについて</option>
                            <option value="sell">売却査定について</option>
                            <option value="other">その他</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>ご相談内容 <span class="required">必須</span></label>
                        <textarea name="message" required placeholder="ご希望物件のイメージ、予算、エリア、投資目的等、お気軽にご記入ください。"></textarea>
                    </div>
                    <div class="form-submit">
                        <button type="submit" class="btn btn-navy">送信する</button>
                    </div>
                    <p class="form-note">
                        ご入力いただいた情報は、お問い合わせ対応の目的にのみ使用し、第三者への提供は行いません。<br>
                        通常 1〜2営業日以内にご返信いたします。
                    </p>
                </form>
            </div>
        </div>
    </section>

    <footer id="site-footer" class="site-footer"></footer>
    <script src="main.js"></script>
    <script>
    (function () {
        'use strict';
        // お問い合わせ送信: GAS台帳（主・スプレッドシート記録） → Formspree（フォールバック）
        var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbz0cw1I_iTZukJNqGASL4m2MoaNwCLVu3cBJ9xFqOhD1cWYf3TeqBwW_yvXi2qjA2CL/exec';
        var FORM_TOKEN = 'mt_sell_7c31b9d4e2af';
        var CATEGORY_LABELS = {
            residence: '住宅購入', investment: '投資物件', luxury: '富裕層向け',
            commercial: '法人・テナント', sell: '売却査定', other: 'その他'
        };

        var form = document.getElementById('inquiry-form');
        if (!form) return;
        var submitBtn = form.querySelector('button[type="submit"]');
        var statusEl = document.createElement('div');
        statusEl.style.cssText = 'margin-top:1rem;padding:14px 18px;border-radius:6px;font-size:0.9rem;display:none;';
        form.appendChild(statusEl);

        function show(type, msg) {
            statusEl.style.display = 'block';
            if (type === 'success') statusEl.style.cssText += 'background:#ecfdf5;color:#065f46;border:1px solid #10b981;';
            else if (type === 'error') statusEl.style.cssText += 'background:#fef2f2;color:#991b1b;border:1px solid #dc2626;';
            else statusEl.style.cssText += 'background:#eff6ff;color:#1e40af;border:1px solid #3b82f6;';
            statusEl.textContent = msg;
        }

        async function sendGAS() {
            var fd = new FormData(form);
            var payload = {
                token: FORM_TOKEN,
                form_type: 'お問い合わせ',
                route: 'contact.html',
                name: fd.get('name') || '',
                mail: fd.get('email') || '',
                tel: fd.get('tel') || '',
                category: CATEGORY_LABELS[fd.get('category')] || fd.get('category') || 'その他',
                message: fd.get('message') || ''
            };
            var res = await fetch(WEBAPP_URL, { method: 'POST', body: JSON.stringify(payload) });
            var j = {};
            try { j = await res.json(); } catch (e) { j = { ok: res.ok }; }
            if (!j || j.ok === false) throw new Error(j.error || 'gas error');
            return j.no || '';
        }

        async function sendFormspree() {
            var res = await fetch(form.action, {
                method: 'POST', body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            });
            if (!res.ok) throw new Error('formspree error');
        }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            var orig = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '送信中…';
            show('info', '送信中です。しばらくお待ちください…');
            try {
                var no = '';
                try { no = await sendGAS(); } catch (gasErr) { await sendFormspree(); }
                show('success', 'お問い合わせを受け付けました。' + (no ? '受付番号：' + no + '。' : '') +
                    '通常1〜2営業日以内にご返信いたします。');
                form.reset();
            } catch (err) {
                show('error', '送信に失敗しました。お手数ですがお電話（0466-96-0313）またはLINEでご連絡ください。');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = orig;
            }
        });
    })();
    </script>
</body>
</html>
