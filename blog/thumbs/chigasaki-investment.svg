<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg-chig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064e3b"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="condo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="condo-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d97706"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow-chig" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg-chig)"/>

  <!-- Sun/glow -->
  <circle cx="640" cy="160" r="55" fill="#fde047" opacity="0.18"/>
  <circle cx="640" cy="160" r="35" fill="#fbbf24" opacity="0.4"/>
  <circle cx="640" cy="160" r="22" fill="#fbbf24"/>

  <!-- Subtle decorative dots -->
  <g opacity="0.1" fill="#fff">
    <circle cx="60" cy="60" r="1.5"/><circle cx="120" cy="100" r="1.5"/><circle cx="180" cy="50" r="1.5"/>
    <circle cx="240" cy="90" r="1.5"/><circle cx="500" cy="60" r="1.5"/><circle cx="560" cy="100" r="1.5"/>
  </g>

  <!-- Center: condo building (mansion) -->
  <g filter="url(#shadow-chig)" transform="translate(280, 200)">
    <!-- Side wall (perspective) -->
    <polygon points="180,30 230,55 230,275 180,255" fill="url(#condo-side)"/>
    <!-- Main facade -->
    <rect x="0" y="30" width="180" height="245" rx="2" fill="url(#condo)"/>
    <!-- Top accent -->
    <rect x="0" y="20" width="180" height="10" fill="#92400e"/>
    <polygon points="180,20 230,45 230,55 180,30" fill="#7c2d12"/>

    <!-- Balcony/floor lines -->
    <g stroke="#7c2d12" stroke-width="1" opacity="0.5">
      <line x1="0" y1="65" x2="180" y2="65"/>
      <line x1="0" y1="105" x2="180" y2="105"/>
      <line x1="0" y1="145" x2="180" y2="145"/>
      <line x1="0" y1="185" x2="180" y2="185"/>
      <line x1="0" y1="225" x2="180" y2="225"/>
    </g>

    <!-- Windows -->
    <g fill="#7c2d12" opacity="0.6">
      <rect x="15" y="40" width="28" height="18" rx="1"/>
      <rect x="55" y="40" width="28" height="18" rx="1"/>
      <rect x="95" y="40" width="28" height="18" rx="1"/>
      <rect x="135" y="40" width="30" height="18" rx="1"/>

      <rect x="15" y="80" width="28" height="18" rx="1"/>
      <rect x="55" y="80" width="28" height="18" rx="1"/>
      <rect x="95" y="80" width="28" height="18" rx="1"/>
      <rect x="135" y="80" width="30" height="18" rx="1"/>

      <rect x="15" y="120" width="28" height="18" rx="1"/>
      <rect x="55" y="120" width="28" height="18" rx="1"/>
      <rect x="95" y="120" width="28" height="18" rx="1"/>
      <rect x="135" y="120" width="30" height="18" rx="1"/>

      <rect x="15" y="160" width="28" height="18" rx="1"/>
      <rect x="55" y="160" width="28" height="18" rx="1"/>
      <rect x="95" y="160" width="28" height="18" rx="1"/>
      <rect x="135" y="160" width="30" height="18" rx="1"/>

      <rect x="15" y="200" width="28" height="18" rx="1"/>
      <rect x="55" y="200" width="28" height="18" rx="1"/>
      <rect x="95" y="200" width="28" height="18" rx="1"/>
      <rect x="135" y="200" width="30" height="18" rx="1"/>

      <rect x="15" y="240" width="28" height="18" rx="1"/>
      <rect x="55" y="240" width="28" height="18" rx="1"/>
      <rect x="95" y="240" width="28" height="18" rx="1"/>
      <rect x="135" y="240" width="30" height="18" rx="1"/>
    </g>
  </g>

  <!-- Yield badge top right -->
  <g filter="url(#shadow-chig)" transform="translate(595, 290)">
    <circle cx="0" cy="0" r="65" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3,4" opacity="0.5"/>
    <text x="0" y="0" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#064e3b" font-size="36" font-weight="700">10.5</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Cormorant Garamond', serif" fill="#064e3b" font-size="18" font-weight="600">% Yield</text>
  </g>

  <!-- Waves at bottom -->
  <g opacity="0.6">
    <path d="M 0 480 Q 80 470 160 480 T 320 480 T 480 480 T 640 480 T 800 480 L 800 540 L 0 540 Z" fill="url(#wave-grad)"/>
    <path d="M 0 500 Q 80 490 160 500 T 320 500 T 480 500 T 640 500 T 800 500 L 800 540 L 0 540 Z" fill="url(#wave-grad)" opacity="0.7"/>
  </g>

  <!-- 5 stars (areas) -->
  <g transform="translate(80, 460)">
    <text x="0" y="0" font-family="'Noto Sans JP', sans-serif" fill="#fff" font-size="12" opacity="0.85" font-weight="600">注目エリア5選</text>
    <g transform="translate(0, 18)" fill="#fbbf24">
      <polygon points="0,-7 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/>
      <g transform="translate(22, 0)"><polygon points="0,-7 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/></g>
      <g transform="translate(44, 0)"><polygon points="0,-7 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/></g>
      <g transform="translate(66, 0)"><polygon points="0,-7 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/></g>
      <g transform="translate(88, 0)"><polygon points="0,-7 2,-2 8,-2 3,2 5,8 0,4 -5,8 -3,2 -8,-2 -2,-2"/></g>
    </g>
  </g>

  <!-- Title -->
  <g font-family="'Noto Sans JP', sans-serif" fill="#fff">
    <text x="60" y="80" font-size="13" letter-spacing="0.18em" opacity="0.75" font-weight="500">CHIGASAKI INVESTMENT 2026</text>
    <text x="60" y="118" font-size="26" font-weight="700">茅ヶ崎の中古マンション投資</text>
  </g>
</svg>
