<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg-kam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#451a03"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="roof-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#44403c"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="house-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="house-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#92400e"/>
      <stop offset="1" stop-color="#78350f"/>
    </linearGradient>
    <filter id="shadow-kam" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg-kam)"/>

  <!-- Mountain silhouette background -->
  <g opacity="0.18" fill="#000">
    <path d="M 0 380 L 100 320 L 180 360 L 280 290 L 380 330 L 480 280 L 580 320 L 680 270 L 800 310 L 800 540 L 0 540 Z"/>
  </g>

  <!-- Falling momiji leaves (autumn) -->
  <g opacity="0.65" fill="#dc2626">
    <g transform="translate(120, 130) rotate(20)">
      <path d="M 0 -10 L 4 -2 L 9 -3 L 5 4 L 9 8 L 2 6 L 0 11 L -2 6 L -9 8 L -5 4 L -9 -3 L -4 -2 Z"/>
    </g>
    <g transform="translate(680, 100) rotate(-15)" opacity="0.5">
      <path d="M 0 -8 L 3 -2 L 7 -2 L 4 3 L 7 6 L 1 4 L 0 8 L -1 4 L -7 6 L -4 3 L -7 -2 L -3 -2 Z"/>
    </g>
    <g transform="translate(550, 200) rotate(45)" opacity="0.4">
      <path d="M 0 -8 L 3 -2 L 7 -2 L 4 3 L 7 6 L 1 4 L 0 8 L -1 4 L -7 6 L -4 3 L -7 -2 L -3 -2 Z"/>
    </g>
    <g transform="translate(200, 230) rotate(-30)" opacity="0.5">
      <path d="M 0 -8 L 3 -2 L 7 -2 L 4 3 L 7 6 L 1 4 L 0 8 L -1 4 L -7 6 L -4 3 L -7 -2 L -3 -2 Z"/>
    </g>
  </g>

  <!-- Traditional Japanese house -->
  <g filter="url(#shadow-kam)" transform="translate(180, 220)">
    <!-- Roof (upturned eaves style) -->
    <path d="M -30 80 Q 170 -30 370 80 L 360 95 Q 170 -10 -20 95 Z" fill="url(#roof-tile)"/>
    <!-- Roof ridge -->
    <path d="M 30 60 L 310 60 L 305 70 L 35 70 Z" fill="#0c0a09"/>
    <!-- Decorative end tiles -->
    <circle cx="0" cy="83" r="8" fill="#44403c"/>
    <circle cx="340" cy="83" r="8" fill="#44403c"/>

    <!-- House body -->
    <rect x="20" y="95" width="300" height="115" fill="url(#house-wall)"/>

    <!-- Sliding doors (shoji) -->
    <g fill="#fff" stroke="url(#house-wood)" stroke-width="2">
      <rect x="40" y="115" width="50" height="90"/>
      <rect x="92" y="115" width="50" height="90"/>
      <rect x="200" y="115" width="50" height="90"/>
      <rect x="252" y="115" width="50" height="90"/>
    </g>
    <!-- Shoji grid lines -->
    <g stroke="url(#house-wood)" stroke-width="1" opacity="0.6">
      <line x1="40" y1="145" x2="142" y2="145"/>
      <line x1="40" y1="175" x2="142" y2="175"/>
      <line x1="65" y1="115" x2="65" y2="205"/>
      <line x1="117" y1="115" x2="117" y2="205"/>

      <line x1="200" y1="145" x2="302" y2="145"/>
      <line x1="200" y1="175" x2="302" y2="175"/>
      <line x1="225" y1="115" x2="225" y2="205"/>
      <line x1="277" y1="115" x2="277" y2="205"/>
    </g>

    <!-- Center pillar / entrance -->
    <rect x="155" y="120" width="35" height="90" fill="url(#house-wood)"/>
    <!-- Genkan step -->
    <rect x="155" y="210" width="35" height="6" fill="#1c1917"/>

    <!-- Vertical wood beams -->
    <g stroke="url(#house-wood)" stroke-width="3" opacity="0.7">
      <line x1="38" y1="95" x2="38" y2="210"/>
      <line x1="304" y1="95" x2="304" y2="210"/>
    </g>
  </g>

  <!-- Inheritance documents stack right -->
  <g filter="url(#shadow-kam)" transform="translate(610, 295)">
    <!-- back doc -->
    <rect x="-6" y="-6" width="100" height="125" rx="3" fill="#fed7aa" transform="rotate(-5)"/>
    <!-- middle doc -->
    <rect x="-3" y="-3" width="100" height="125" rx="3" fill="#fff7ed" transform="rotate(3)"/>
    <!-- front doc -->
    <rect x="0" y="0" width="100" height="125" rx="3" fill="#fff"/>
    <rect x="0" y="0" width="100" height="14" rx="3" fill="#7c2d12"/>
    <text x="50" y="10" text-anchor="middle" font-family="'Noto Serif JP', serif" fill="#fff" font-size="9" font-weight="600">登記簿謄本</text>
    <g stroke="#92400e" stroke-width="1" opacity="0.4">
      <line x1="12" y1="30" x2="78" y2="30"/>
      <line x1="12" y1="42" x2="86" y2="42"/>
      <line x1="12" y1="54" x2="70" y2="54"/>
      <line x1="12" y1="66" x2="82" y2="66"/>
      <line x1="12" y1="78" x2="68" y2="78"/>
    </g>
    <!-- Hanko seal -->
    <g transform="translate(72, 96)">
      <circle r="14" fill="none" stroke="#dc2626" stroke-width="2"/>
      <circle r="11" fill="none" stroke="#dc2626" stroke-width="0.8"/>
      <text y="3" text-anchor="middle" font-family="'Noto Serif JP', serif" fill="#dc2626" font-size="7" font-weight="700">磯谷</text>
    </g>
  </g>

  <!-- Ground line -->
  <line x1="40" y1="461" x2="760" y2="461" stroke="#fff" stroke-width="1.5" opacity="0.35"/>

  <!-- Title -->
  <g font-family="'Noto Sans JP', sans-serif" fill="#fff">
    <text x="60" y="80" font-size="13" letter-spacing="0.18em" opacity="0.75" font-weight="500">KAMAKURA · INHERITED PROPERTY</text>
    <text x="60" y="118" font-size="26" font-weight="700">鎌倉の相続不動産・実家じまい</text>
  </g>
</svg>
