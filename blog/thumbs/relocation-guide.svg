<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg-reloc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b0a5e"/>
      <stop offset="1" stop-color="#6b21a8"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ea580c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow-reloc" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="540" fill="url(#bg-reloc)"/>

  <!-- Decorative dots pattern -->
  <g opacity="0.08" fill="#fff">
    <circle cx="100" cy="100" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="300" cy="120" r="2"/>
    <circle cx="500" cy="90" r="2"/><circle cx="650" cy="130" r="2"/><circle cx="700" cy="60" r="2"/>
    <circle cx="50" cy="200" r="2"/><circle cx="150" cy="220" r="2"/>
  </g>

  <!-- LEFT: Tokyo skyline (towers) -->
  <g filter="url(#shadow-reloc)" transform="translate(60, 250)">
    <!-- Tall tower -->
    <rect x="0" y="0" width="50" height="210" rx="3" fill="url(#tower)"/>
    <g opacity="0.4" fill="#3b0a5e">
      <rect x="8" y="14" width="10" height="10"/><rect x="22" y="14" width="10" height="10"/><rect x="36" y="14" width="6" height="10"/>
      <rect x="8" y="34" width="10" height="10"/><rect x="22" y="34" width="10" height="10"/><rect x="36" y="34" width="6" height="10"/>
      <rect x="8" y="54" width="10" height="10"/><rect x="22" y="54" width="10" height="10"/><rect x="36" y="54" width="6" height="10"/>
      <rect x="8" y="74" width="10" height="10"/><rect x="22" y="74" width="10" height="10"/><rect x="36" y="74" width="6" height="10"/>
      <rect x="8" y="94" width="10" height="10"/><rect x="22" y="94" width="10" height="10"/><rect x="36" y="94" width="6" height="10"/>
      <rect x="8" y="114" width="10" height="10"/><rect x="22" y="114" width="10" height="10"/><rect x="36" y="114" width="6" height="10"/>
      <rect x="8" y="134" width="10" height="10"/><rect x="22" y="134" width="10" height="10"/><rect x="36" y="134" width="6" height="10"/>
      <rect x="8" y="154" width="10" height="10"/><rect x="22" y="154" width="10" height="10"/><rect x="36" y="154" width="6" height="10"/>
      <rect x="8" y="174" width="10" height="10"/><rect x="22" y="174" width="10" height="10"/><rect x="36" y="174" width="6" height="10"/>
    </g>
    <!-- Middle tower -->
    <rect x="60" y="40" width="44" height="170" rx="3" fill="url(#tower)" opacity="0.9"/>
    <g opacity="0.4" fill="#3b0a5e">
      <rect x="68" y="56" width="9" height="9"/><rect x="80" y="56" width="9" height="9"/><rect x="92" y="56" width="8" height="9"/>
      <rect x="68" y="74" width="9" height="9"/><rect x="80" y="74" width="9" height="9"/><rect x="92" y="74" width="8" height="9"/>
      <rect x="68" y="92" width="9" height="9"/><rect x="80" y="92" width="9" height="9"/><rect x="92" y="92" width="8" height="9"/>
      <rect x="68" y="110" width="9" height="9"/><rect x="80" y="110" width="9" height="9"/><rect x="92" y="110" width="8" height="9"/>
      <rect x="68" y="128" width="9" height="9"/><rect x="80" y="128" width="9" height="9"/><rect x="92" y="128" width="8" height="9"/>
      <rect x="68" y="146" width="9" height="9"/><rect x="80" y="146" width="9" height="9"/><rect x="92" y="146" width="8" height="9"/>
      <rect x="68" y="164" width="9" height="9"/><rect x="80" y="164" width="9" height="9"/><rect x="92" y="164" width="8" height="9"/>
      <rect x="68" y="182" width="9" height="9"/><rect x="80" y="182" width="9" height="9"/><rect x="92" y="182" width="8" height="9"/>
    </g>
    <!-- Short tower -->
    <rect x="114" y="80" width="40" height="130" rx="3" fill="url(#tower)" opacity="0.8"/>
    <g opacity="0.4" fill="#3b0a5e">
      <rect x="122" y="96" width="8" height="9"/><rect x="134" y="96" width="8" height="9"/><rect x="146" y="96" width="6" height="9"/>
      <rect x="122" y="114" width="8" height="9"/><rect x="134" y="114" width="8" height="9"/><rect x="146" y="114" width="6" height="9"/>
      <rect x="122" y="132" width="8" height="9"/><rect x="134" y="132" width="8" height="9"/><rect x="146" y="132" width="6" height="9"/>
      <rect x="122" y="150" width="8" height="9"/><rect x="134" y="150" width="8" height="9"/><rect x="146" y="150" width="6" height="9"/>
      <rect x="122" y="168" width="8" height="9"/><rect x="134" y="168" width="8" height="9"/><rect x="146" y="168" width="6" height="9"/>
      <rect x="122" y="186" width="8" height="9"/><rect x="134" y="186" width="8" height="9"/><rect x="146" y="186" width="6" height="9"/>
    </g>
  </g>

  <!-- Center: Big curved arrow Tokyo → Shonan -->
  <g transform="translate(280, 350)">
    <path d="M 0 30 Q 100 -60 220 30" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-dasharray="0"/>
    <!-- Arrowhead -->
    <path d="M 215 30 L 230 25 L 222 38 Z" fill="#fff"/>
    <!-- Plane/icon at curve top -->
    <g transform="translate(110, -27)">
      <circle r="14" fill="#fff" opacity="0.95"/>
      <path d="M -7 0 L 0 -6 L 7 0 L 5 5 L -5 5 Z" fill="#6b21a8"/>
    </g>
  </g>

  <!-- RIGHT: Suburban detached house -->
  <g filter="url(#shadow-reloc)" transform="translate(560, 270)">
    <!-- Roof -->
    <polygon points="0,80 90,0 180,80" fill="url(#roof)"/>
    <!-- House body -->
    <rect x="10" y="80" width="160" height="120" fill="url(#house)"/>
    <!-- Door -->
    <rect x="75" y="130" width="30" height="70" fill="#7c2d12"/>
    <circle cx="98" cy="170" r="2" fill="#fde68a"/>
    <!-- Windows -->
    <g fill="#fff">
      <rect x="25" y="100" width="34" height="34" rx="2"/>
      <rect x="121" y="100" width="34" height="34" rx="2"/>
    </g>
    <g stroke="#7c2d12" stroke-width="1.5">
      <line x1="42" y1="100" x2="42" y2="134"/>
      <line x1="25" y1="117" x2="59" y2="117"/>
      <line x1="138" y1="100" x2="138" y2="134"/>
      <line x1="121" y1="117" x2="155" y2="117"/>
    </g>
    <!-- Chimney -->
    <rect x="125" y="15" width="20" height="35" fill="url(#roof)"/>
    <!-- Tree -->
    <g transform="translate(-30, 130)">
      <rect x="11" y="55" width="6" height="20" fill="#4a2511"/>
      <circle cx="14" cy="45" r="22" fill="#16a34a"/>
      <circle cx="6" cy="55" r="14" fill="#16a34a"/>
      <circle cx="22" cy="55" r="14" fill="#16a34a"/>
    </g>
  </g>

  <!-- Ground line -->
  <line x1="40" y1="461" x2="760" y2="461" stroke="#fff" stroke-width="1.5" opacity="0.4"/>

  <!-- Labels -->
  <g font-family="'Cormorant Garamond', serif" fill="#fff" opacity="0.9">
    <text x="140" y="488" text-anchor="middle" font-size="18" letter-spacing="0.1em">TOKYO</text>
    <text x="650" y="488" text-anchor="middle" font-size="18" letter-spacing="0.1em">SHONAN</text>
  </g>

  <!-- Title -->
  <g font-family="'Noto Sans JP', sans-serif" fill="#fff">
    <text x="60" y="80" font-size="13" letter-spacing="0.18em" opacity="0.75" font-weight="500">RELOCATION GUIDE 2026</text>
    <text x="60" y="118" font-size="26" font-weight="700">東京から湘南へ移住</text>
  </g>
</svg>
