<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物件一覧 | Shonan Minato REAL ESTATE</title>
    <meta name="description" content="湘南・横浜・東京エリアの住宅売買、投資物件、富裕層向け邸宅、法人向けテナント物件一覧。">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="site-header" class="site-header"></header>

    <div class="page-header">
        <div class="container">
            <span class="section-label">Properties</span>
            <h1>物件一覧</h1>
        </div>
    </div>

    <div class="filter-bar">
        <div class="filter-inner">
            <span class="filter-label">カテゴリ</span>
            <button class="filter-btn active" data-cat="all">すべて</button>
            <button class="filter-btn" data-cat="residence">住宅</button>
            <button class="filter-btn" data-cat="investment">投資</button>
            <button class="filter-btn" data-cat="luxury">富裕層向け</button>
            <button class="filter-btn" data-cat="commercial">法人・テナント</button>
        </div>
    </div>

    <section>
        <div class="container">
            <div class="properties-grid" id="properties-list"></div>
        </div>
    </section>

    <section class="cta-banner">
        <div class="container cta-banner-inner">
            <h2 class="cta-title">非公開物件情報もご用意しています</h2>
            <p class="cta-sub">会員登録いただいた方には、一般公開前の優良物件情報をお届けします。</p>
            <div class="cta-buttons">
                <a href="contact.html" class="btn btn-primary">お問い合わせ</a>
            </div>
        </div>
    </section>

    <footer id="site-footer" class="site-footer"></footer>
    <script src="main.js"></script>
</body>
</html>
