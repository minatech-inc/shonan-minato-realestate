<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <defs>
    <linearGradient id="bg-invest" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2e25"/>
      <stop offset="1" stop-color="#1a4d3a"/>
    </linearGradient>
    <linearGradient id="bldg1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="bldg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="540" fill="url(#bg-invest)"/>

  <!-- Decorative grid lines -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="135" x2="800" y2="135"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="405" x2="800" y2="405"/>
    <line x1="200" y1="0" x2="200" y2="540"/>
    <line x1="400" y1="0" x2="400" y2="540"/>
    <line x1="600" y1="0" x2="600" y2="540"/>
  </g>

  <!-- Rising chart background -->
  <g opacity="0.35">
    <polyline points="60,440 180,400 280,350 380,280 480,230 580,180 700,140 740,110"
              fill="none" stroke="#5eead4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="180" cy="400" r="4" fill="#5eead4"/>
    <circle cx="380" cy="280" r="4" fill="#5eead4"/>
    <circle cx="580" cy="180" r="4" fill="#5eead4"/>
    <circle cx="740" cy="110" r="4" fill="#5eead4"/>
  </g>

  <!-- 3 Buildings (representing 藤沢, 茅ヶ崎, 鎌倉) -->
  <g filter="url(#soft-shadow)">
    <!-- 藤沢 (tallest) -->
    <g transform="translate(160, 200)">
      <rect x="0" y="0" width="120" height="260" rx="4" fill="url(#bldg1)"/>
      <g opacity="0.4" fill="#0a2e25">
        <rect x="14" y="22" width="20" height="18" rx="1"/>
        <rect x="50" y="22" width="20" height="18" rx="1"/>
        <rect x="86" y="22" width="20" height="18" rx="1"/>
        <rect x="14" y="56" width="20" height="18" rx="1"/>
        <rect x="50" y="56" width="20" height="18" rx="1"/>
        <rect x="86" y="56" width="20" height="18" rx="1"/>
        <rect x="14" y="90" width="20" height="18" rx="1"/>
        <rect x="50" y="90" width="20" height="18" rx="1"/>
        <rect x="86" y="90" width="20" height="18" rx="1"/>
        <rect x="14" y="124" width="20" height="18" rx="1"/>
        <rect x="50" y="124" width="20" height="18" rx="1"/>
        <rect x="86" y="124" width="20" height="18" rx="1"/>
        <rect x="14" y="158" width="20" height="18" rx="1"/>
        <rect x="50" y="158" width="20" height="18" rx="1"/>
        <rect x="86" y="158" width="20" height="18" rx="1"/>
        <rect x="14" y="192" width="20" height="18" rx="1"/>
        <rect x="50" y="192" width="20" height="18" rx="1"/>
        <rect x="86" y="192" width="20" height="18" rx="1"/>
        <rect x="14" y="226" width="20" height="18" rx="1"/>
        <rect x="50" y="226" width="20" height="18" rx="1"/>
        <rect x="86" y="226" width="20" height="18" rx="1"/>
      </g>
    </g>
    <!-- 茅ヶ崎 (middle) -->
    <g transform="translate(330, 260)">
      <rect x="0" y="0" width="110" height="200" rx="4" fill="url(#bldg2)"/>
      <g opacity="0.4" fill="#0a2e25">
        <rect x="14" y="22" width="18" height="16" rx="1"/>
        <rect x="46" y="22" width="18" height="16" rx="1"/>
        <rect x="78" y="22" width="18" height="16" rx="1"/>
        <rect x="14" y="52" width="18" height="16" rx="1"/>
        <rect x="46" y="52" width="18" height="16" rx="1"/>
        <rect x="78" y="52" width="18" height="16" rx="1"/>
        <rect x="14" y="82" width="18" height="16" rx="1"/>
        <rect x="46" y="82" width="18" height="16" rx="1"/>
        <rect x="78" y="82" width="18" height="16" rx="1"/>
        <rect x="14" y="112" width="18" height="16" rx="1"/>
        <rect x="46" y="112" width="18" height="16" rx="1"/>
        <rect x="78" y="112" width="18" height="16" rx="1"/>
        <rect x="14" y="142" width="18" height="16" rx="1"/>
        <rect x="46" y="142" width="18" height="16" rx="1"/>
        <rect x="78" y="142" width="18" height="16" rx="1"/>
        <rect x="14" y="172" width="18" height="16" rx="1"/>
        <rect x="46" y="172" width="18" height="16" rx="1"/>
        <rect x="78" y="172" width="18" height="16" rx="1"/>
      </g>
    </g>
    <!-- 鎌倉 (smallest, premium) -->
    <g transform="translate(490, 310)">
      <rect x="0" y="0" width="100" height="150" rx="4" fill="url(#bldg3)"/>
      <g opacity="0.35" fill="#7c2d12">
        <rect x="14" y="22" width="18" height="16" rx="1"/>
        <rect x="42" y="22" width="18" height="16" rx="1"/>
        <rect x="70" y="22" width="18" height="16" rx="1"/>
        <rect x="14" y="52" width="18" height="16" rx="1"/>
        <rect x="42" y="52" width="18" height="16" rx="1"/>
        <rect x="70" y="52" width="18" height="16" rx="1"/>
        <rect x="14" y="82" width="18" height="16" rx="1"/>
        <rect x="42" y="82" width="18" height="16" rx="1"/>
        <rect x="70" y="82" width="18" height="16" rx="1"/>
        <rect x="14" y="112" width="18" height="16" rx="1"/>
        <rect x="42" y="112" width="18" height="16" rx="1"/>
        <rect x="70" y="112" width="18" height="16" rx="1"/>
      </g>
    </g>
  </g>

  <!-- Ground line -->
  <line x1="80" y1="461" x2="720" y2="461" stroke="#fff" stroke-width="1.5" opacity="0.4"/>

  <!-- Yield labels above buildings -->
  <g font-family="'Cormorant Garamond', serif" fill="#fff">
    <text x="220" y="180" text-anchor="middle" font-size="22" font-weight="600">7.5%</text>
    <text x="385" y="240" text-anchor="middle" font-size="20" font-weight="600">7.0%</text>
    <text x="540" y="290" text-anchor="middle" font-size="20" font-weight="600">6.5%</text>
  </g>

  <!-- Up arrow accent (top right) -->
  <g transform="translate(660, 80)" opacity="0.85">
    <circle cx="0" cy="0" r="28" fill="#fbbf24" opacity="0.18"/>
    <path d="M -10 6 L 0 -8 L 10 6 M 0 -6 L 0 10" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title text -->
  <g font-family="'Noto Sans JP', sans-serif" fill="#fff">
    <text x="60" y="70" font-size="13" letter-spacing="0.18em" opacity="0.7" font-weight="500">INVESTMENT COMPARISON 2026</text>
    <text x="60" y="108" font-size="26" font-weight="700">湘南3エリア投資収益比較</text>
  </g>
</svg>
