<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ | Shonan Minato REAL ESTATE</title>
    <meta name="description" content="物件・売却・投資・テナントに関するお問い合わせはこちらから。">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Noto+Sans+JP:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header id="site-header" class="site-header"></header>

    <div class="page-header">
        <div class="container">
            <span class="section-label">Contact</span>
            <h1>お問い合わせ</h1>
        </div>
    </div>

    <section class="form-section">
        <div class="form-container">
            <div class="form-card">
                <p style="text-align: center; color: var(--gray-700); margin-bottom: 2.5rem; font-size: 0.9rem; line-height: 2;">
                    購入・売却・投資・テナント — あらゆるご相談にお応えします。<br>
                    下記フォームにご記入いただくか、お電話（<a href="tel:0467-28-7603" style="color: var(--gold-dark);">0467-28-7603</a>）にて承ります。
                </p>

                <form action="https://formspree.io/f/your-endpoint-here" method="POST" id="contact-form">
                    <div class="form-row">
                        <label>お名前 <span class="required">必須</span></label>
                        <input type="text" name="name" required>
                    </div>
                    <div class="form-row">
                        <label>メールアドレス <span class="required">必須</span></label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="form-row">
                        <label>電話番号</label>
                        <input type="tel" name="tel">
                    </div>
                    <div class="form-row">
                        <label>お問い合わせ種別 <span class="required">必須</span></label>
                        <select name="category" required>
                            <option value="">選択してください</option>
                            <option value="residence">住宅購入について</option>
                            <option value="investment">投資物件について</option>
                            <option value="luxury">富裕層向け物件について</option>
                            <option value="commercial">法人・テナントについて</option>
                            <option value="sell">売却査定について</option>
                            <option value="other">その他</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <label>ご相談内容 <span class="required">必須</span></label>
                        <textarea name="message" required placeholder="ご希望物件のイメージ、予算、エリア、投資目的等、お気軽にご記入ください。"></textarea>
                    </div>
                    <div class="form-submit">
                        <button type="submit" class="btn btn-navy">送信する</button>
                    </div>
                    <p class="form-note">
                        ご入力いただいた情報は、お問い合わせ対応の目的にのみ使用し、第三者への提供は行いません。<br>
                        通常 1〜2営業日以内にご返信いたします。
                    </p>
                </form>
            </div>
        </div>
    </section>

    <footer id="site-footer" class="site-footer"></footer>
    <script src="/main.js"></script>
</body>
</html>
